<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#881144" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#881144" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#243a66" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#243a66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff69b4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a3123f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="430" y1="0" x2="770" y2="0">
      <stop offset="0%" stop-color="#fbe9ec"/>
      <stop offset="45%" stop-color="#ff9ecb"/>
      <stop offset="50%" stop-color="#ff69b4"/>
      <stop offset="55%" stop-color="#ff9ecb"/>
      <stop offset="100%" stop-color="#fbe9ec"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-340 0" to="340 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="360" fill="#120a0f"/>

  <!-- drifting glows -->
  <ellipse cx="240" cy="120" rx="360" ry="300" fill="url(#glowA)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 40 -20; 0 0" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="980" cy="260" rx="420" ry="320" fill="url(#glowB)">
    <animate attributeName="opacity" values="0.6;0.95;0.6" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -50 24; 0 0" dur="17s" repeatCount="indefinite"/>
  </ellipse>

  <!-- constellation specks -->
  <g fill="#fbe9ec">
    <circle cx="120" cy="70" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90" r="1.6"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="46" r="1.2"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="150" r="1.2"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- wordmark -->
  <text x="600" y="126" text-anchor="middle" font-size="92" font-weight="700" letter-spacing="6" fill="url(#title)">PERSEUS</text>
  <text x="600" y="166" text-anchor="middle" font-size="18" letter-spacing="1" fill="#f6dfe4" opacity="0.72">A stress test for sales funnels — find the leak, rewrite it, prove it before it ships.</text>
  <text x="600" y="196" text-anchor="middle" font-size="12" letter-spacing="3" font-family="monospace" fill="#ec8298" opacity="0.8">v4.0.0-DRAFT · CONCEPT BUILD · SYNTHETIC ONLY</text>

  <!-- funnel band -->
  <g transform="translate(0,20)">
    <!-- spine + animated dash -->
    <line x1="150" y1="270" x2="1000" y2="270" stroke="url(#spine)" stroke-width="2"/>
    <line x1="150" y1="270" x2="1000" y2="270" stroke="#ff69b4" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="6 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- section squares -->
    <g>
      <rect x="223" y="243" width="54" height="54" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ff4d6d" stroke-opacity="0.5"/>
      <rect x="403" y="243" width="54" height="54" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#f7b7cd" stroke-opacity="0.4"/>
      <rect x="583" y="243" width="54" height="54" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="763" y="243" width="54" height="54" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ff69b4" stroke-opacity="0.4"/>
    </g>
    <g font-family="monospace" font-size="10" fill="#fbe9ec" fill-opacity="0.4" text-anchor="middle">
      <text x="250" y="320">HERO</text>
      <text x="430" y="320">EMAIL</text>
      <text x="610" y="320">PRICE</text>
      <text x="790" y="320">BOOK</text>
    </g>

    <!-- booking node -->
    <circle cx="980" cy="270" r="13" fill="#ff69b4">
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="270" r="13" fill="none" stroke="#ff69b4" stroke-width="2">
      <animate attributeName="r" values="13;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="980" y="322" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff69b4">BOOKED</text>

    <!-- converting crawlers -->
    <circle r="5" fill="#ff69b4">
      <animateMotion path="M150,270 H970" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#7b93d4">
      <animateMotion path="M150,270 H970" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- dropping crawlers (peel off + fade) -->
    <circle r="4.5" fill="#ff4d6d">
      <animateMotion path="M150,270 L430,270 L470,335" dur="5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#f7b7cd">
      <animateMotion path="M150,270 L610,270 L650,336" dur="6.5s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.72;1" dur="6.5s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#c07ba8">
      <animateMotion path="M150,270 L250,270 L285,332" dur="4.4s" begin="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.65;1" dur="4.4s" begin="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
